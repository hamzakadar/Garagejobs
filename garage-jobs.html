<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>Garage Jobs</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #111111; --surface: #1a1a1a; --surface2: #222222;
    --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.18);
    --text: #f0f0f0; --text2: #888888; --text3: #555555;
    --accent: #e8ff47; --accent-dim: rgba(232,255,71,0.12); --accent-text: #111111;
    --danger: #ff5e5e; --danger-dim: rgba(255,94,94,0.12);
    --success: #4cff91; --success-dim: rgba(76,255,145,0.12);
    --warning: #ffb347; --warning-dim: rgba(255,179,71,0.13);
    --info: #5eb8ff; --info-dim: rgba(94,184,255,0.12);
    --radius: 10px; --radius-lg: 14px;
  }
  html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; min-height: 100vh; overscroll-behavior: none; }
  .app { display: flex; flex-direction: column; min-height: 100vh; max-width: 480px; margin: 0 auto; }
  header { padding: 1rem 1.25rem 0.75rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 0.5px solid var(--border); }
  .logo { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .logo span { color: var(--accent); }
  .header-date { font-size: 13px; color: var(--text2); }
  .tab-bar { display: flex; background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 0 1rem; }
  .tab { flex: 1; padding: 0.7rem 0; font-size: 13px; font-weight: 500; background: none; border: none; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .page { display: none; padding: 1.25rem; flex: 1; }
  .page.active { display: block; }

  /* Form */
  .field { margin-bottom: 1rem; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  input, textarea, select { width: 100%; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; color: var(--text); font-size: 16px; font-family: inherit; -webkit-appearance: none; appearance: none; transition: border-color 0.15s; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { resize: none; height: 80px; }
  .price-wrap { position: relative; }
  .price-wrap .sym { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text2); font-size: 16px; pointer-events: none; }
  .price-wrap input { padding-left: 24px; }
  input::placeholder, textarea::placeholder { color: var(--text3); }
  select option { background: #1a1a1a; color: var(--text); }

  /* Calendar */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav-btn { width: 36px; height: 36px; border-radius: 8px; background: var(--surface); border: 0.5px solid var(--border); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .cal-nav-btn:hover { border-color: var(--border2); }
  .cal-month { font-size: 15px; font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 1rem; }
  .cal-hdr { text-align: center; font-size: 11px; font-weight: 600; color: var(--text3); padding: 6px 0; text-transform: uppercase; letter-spacing: 0.05em; }
  .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 14px; border-radius: 8px; cursor: pointer; border: 0.5px solid transparent; transition: background 0.1s, border-color 0.1s; gap: 2px; }
  .cal-day:hover:not(.off):not(.past) { background: var(--surface2); }
  .cal-day.off { color: var(--text3); cursor: default; }
  .cal-day.past { color: var(--text3); cursor: default; opacity: 0.5; }
  .cal-day.workday { color: var(--text); }
  .cal-day.today { border-color: var(--border2); }
  .cal-day.selected { background: var(--accent); color: var(--accent-text) !important; font-weight: 700; border-color: var(--accent); }
  .cal-day.has-jobs:not(.selected) { border-color: var(--accent); color: var(--accent); }
  .job-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .cal-day.selected .job-dot { background: var(--accent-text); }
  .cal-day.past .job-dot { background: var(--text3); }

  /* Slots */
  .slots-label { font-size: 13px; color: var(--text2); margin-bottom: 10px; font-weight: 500; }
  .slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1.25rem; }
  .slot-btn { padding: 12px 8px; text-align: center; font-size: 14px; font-weight: 600; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); cursor: pointer; transition: all 0.15s; }
  .slot-btn:hover:not(.taken) { border-color: var(--border2); }
  .slot-btn.selected { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .slot-btn.taken { opacity: 0.35; cursor: not-allowed; text-decoration: line-through; color: var(--text3); }

  /* Buttons */
  .btn-primary { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; background: var(--accent); color: var(--accent-text); border: none; border-radius: var(--radius-lg); cursor: pointer; letter-spacing: 0.01em; transition: opacity 0.15s, transform 0.1s; }
  .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-primary:not(:disabled):active { transform: scale(0.98); }
  .btn-sm { padding: 7px 13px; font-size: 13px; font-weight: 600; border-radius: 8px; border: 0.5px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; font-family: inherit; white-space: nowrap; transition: border-color 0.15s; }
  .btn-sm:hover { border-color: var(--border2); }
  .btn-danger { background: none; border: 0.5px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 7px 13px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 600; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120%); background: var(--success-dim); border: 0.5px solid var(--success); color: var(--success); padding: 12px 20px; border-radius: var(--radius-lg); font-size: 14px; font-weight: 500; white-space: nowrap; transition: transform 0.25s ease; z-index: 100; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger-dim); border-color: var(--danger); color: var(--danger); }

  /* Job cards */
  .section-title { font-size: 12px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .job-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 10px; }
  .job-card.status-unconfirmed { border-left: 3px solid var(--danger); }
  .job-card.status-confirmed { border-left: 3px solid var(--warning); }
  .job-card.status-inprogress { border-left: 3px solid var(--info); }
  .job-card.status-complete { border-left: 3px solid var(--success); }
  .job-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .job-card-name { font-size: 16px; font-weight: 600; }
  .job-card-slot { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-dim); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .job-detail { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text2); margin-bottom: 6px; }
  .job-detail svg { flex-shrink: 0; opacity: 0.6; }
  .job-notes { font-size: 13px; color: var(--text2); font-style: italic; margin-top: 8px; padding-top: 8px; border-top: 0.5px solid var(--border); }

  /* Status badge */
  .status-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
  .badge-unconfirmed { background: var(--danger-dim); color: var(--danger); }
  .badge-confirmed { background: var(--warning-dim); color: var(--warning); }
  .badge-inprogress { background: var(--info-dim); color: var(--info); }
  .badge-complete { background: var(--success-dim); color: var(--success); }

  /* Progress stepper */
  .stepper { display: flex; align-items: center; gap: 0; margin: 12px 0; }
  .step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .step-dot { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border2); background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text3); cursor: pointer; transition: all 0.2s; position: relative; z-index: 1; }
  .step-dot.active { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
  .step-dot.done { border-color: var(--success); background: var(--success-dim); color: var(--success); }
  .step-label { font-size: 10px; font-weight: 600; color: var(--text3); text-align: center; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.2; }
  .step-label.active { color: var(--accent); }
  .step-label.done { color: var(--success); }
  .step-line { flex: 1; height: 1.5px; background: var(--border2); margin-top: -18px; position: relative; z-index: 0; }
  .step-line.done { background: var(--success); }

  /* Action row */
  .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); }

  /* Payment section */
  .payment-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 10px 12px; background: var(--surface2); border-radius: var(--radius); }
  .payment-label { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .payment-method { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--accent-dim); color: var(--accent); }
  .payment-received { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 6px; cursor: pointer; border: none; font-family: inherit; transition: all 0.15s; }
  .payment-received.yes { background: var(--success-dim); color: var(--success); border: 0.5px solid var(--success); }
  .payment-received.no { background: var(--danger-dim); color: var(--danger); border: 0.5px solid var(--danger); }

  /* Confirmation box */
  .confirm-box { background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px; margin-top: 10px; }
  .confirm-box-label { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .confirm-msg { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 10px; }

  /* Misc */
  hr { border: none; border-top: 0.5px solid var(--border); margin: 1.25rem 0; }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 14px; }
  .empty-state .big { font-size: 32px; margin-bottom: 8px; }
  .upcoming-date { font-size: 13px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin: 1.25rem 0 8px; }
  .upcoming-date:first-child { margin-top: 0; }
  .install-banner { margin: 0 0 1.25rem; background: var(--accent-dim); border: 0.5px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; font-size: 13px; color: var(--accent); display: flex; align-items: center; gap: 10px; }
  .install-banner button { margin-left: auto; background: var(--accent); color: var(--accent-text); border: none; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }

  /* Filter pills */
  .filter-bar { display: flex; gap: 6px; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 2px; }
  .filter-pill { padding: 5px 13px; border-radius: 20px; font-size: 12px; font-weight: 700; border: 0.5px solid var(--border); background: var(--surface); color: var(--text2); cursor: pointer; white-space: nowrap; transition: all 0.15s; }
  .filter-pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Garage<span>.</span>Jobs</div>
    <div class="header-date" id="header-date"></div>
  </header>
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('book')">Book</button>
    <button class="tab" onclick="switchTab('upcoming')">Upcoming</button>
    <button class="tab" onclick="switchTab('calendar')">Calendar</button>
  </div>

  <!-- BOOK PAGE -->
  <div class="page active" id="page-book">
    <div id="install-banner" class="install-banner" style="display:none;">
      <span>📲 Add to home screen to use as an app</span>
      <button onclick="document.getElementById('install-banner').style.display='none'">OK</button>
    </div>
    <div class="field"><label>Customer name</label><input type="text" id="cname" placeholder="e.g. John Smith" autocomplete="off" oninput="updateBtn()"></div>
    <div class="field"><label>Phone number</label><input type="tel" id="cphone" placeholder="(612) 555-0100" autocomplete="off"></div>
    <div class="field"><label>Address</label><input type="text" id="caddress" placeholder="Street, city" autocomplete="off"></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div class="field"><label>Price (USD)</label><div class="price-wrap"><span class="sym">$</span><input type="number" id="cprice" placeholder="0" min="0"></div></div>
      <div class="field"><label>Payment via</label>
        <select id="cpaymethod">
          <option value="">— select —</option>
          <option value="Cash">Cash</option>
          <option value="Zelle">Zelle</option>
          <option value="Stripe">Stripe</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Notes</label><textarea id="cnotes" placeholder="Access code, special items, anything important…"></textarea></div>
    <hr>
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="prevBookMonth()">‹</button>
      <div class="cal-month" id="book-month-label"></div>
      <button class="cal-nav-btn" onclick="nextBookMonth()">›</button>
    </div>
    <div class="cal-grid" id="book-cal"></div>
    <div id="slot-wrap" style="display:none;">
      <div class="slots-label" id="slots-label"></div>
      <div class="slot-grid" id="slot-grid"></div>
    </div>
    <button class="btn-primary" id="book-btn" onclick="bookJob()" disabled>Book job</button>
  </div>

  <!-- UPCOMING PAGE -->
  <div class="page" id="page-upcoming">
    <div class="filter-bar">
      <button class="filter-pill active" onclick="setFilter('all',this)">All</button>
      <button class="filter-pill" onclick="setFilter('unconfirmed',this)">Unconfirmed</button>
      <button class="filter-pill" onclick="setFilter('confirmed',this)">Confirmed</button>
      <button class="filter-pill" onclick="setFilter('inprogress',this)">In Progress</button>
      <button class="filter-pill" onclick="setFilter('complete',this)">Complete</button>
    </div>
    <div id="upcoming-list"></div>
  </div>

  <!-- CALENDAR PAGE -->
  <div class="page" id="page-calendar">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="prevViewMonth()">‹</button>
      <div class="cal-month" id="view-month-label"></div>
      <button class="cal-nav-btn" onclick="nextViewMonth()">›</button>
    </div>
    <div class="cal-grid" id="view-cal"></div>
    <div id="day-jobs"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WORK_DAYS=[1,2,5];
const SLOTS={1:['9:00 AM','1:00 PM'],2:['9:00 AM','1:00 PM'],5:['9:00 AM','3:00 PM']};
const DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
const STATUS_ORDER=['unconfirmed','confirmed','inprogress','complete'];
const STATUS_LABELS={unconfirmed:'Not Confirmed',confirmed:'Confirmed',inprogress:'In Progress',complete:'Complete'};
const STATUS_BADGE={unconfirmed:'badge-unconfirmed',confirmed:'badge-confirmed',inprogress:'badge-inprogress',complete:'badge-complete'};
const STEP_ICONS={unconfirmed:'?',confirmed:'✓',inprogress:'▶',complete:'★'};

let jobs=JSON.parse(localStorage.getItem('gj_jobs2')||'[]');
let bookMonth=new Date(); bookMonth.setDate(1);
let viewMonth=new Date(); viewMonth.setDate(1);
let selDate=null, selSlot=null, upcomingFilter='all';

function save(){localStorage.setItem('gj_jobs2',JSON.stringify(jobs));}
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today0(){const d=new Date();d.setHours(0,0,0,0);return d;}
function isPast(d){return d<today0();}
function isWork(d){return WORK_DAYS.includes(d.getDay());}
function jobsOn(d){const k=dk(d);return jobs.filter(j=>j.date===k);}
function slotTaken(d,s){return jobsOn(d).some(j=>j.slot===s);}
function fmtDate(dateStr){const d=new Date(dateStr+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'America/Chicago'});}

// Header
const now=new Date();
document.getElementById('header-date').textContent=now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'America/Chicago'});

// Install banner
if(/iphone|ipad|android/i.test(navigator.userAgent)&&!window.navigator.standalone){
  document.getElementById('install-banner').style.display='flex';
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['book','upcoming','calendar'][i]===t));
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+t).classList.add('active');
  if(t==='upcoming') renderUpcoming();
  if(t==='calendar') renderViewCal();
}

function setFilter(f,el){
  upcomingFilter=f;
  document.querySelectorAll('.filter-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  renderUpcoming();
}

// ── Book calendar ──
function renderBookCal(){
  const y=bookMonth.getFullYear(),m=bookMonth.getMonth();
  document.getElementById('book-month-label').textContent=MONTH_NAMES[m]+' '+y;
  const grid=document.getElementById('book-cal');
  grid.innerHTML=DAY_NAMES.map(d=>`<div class="cal-hdr">${d}</div>`).join('');
  const first=new Date(y,m,1).getDay();
  for(let i=0;i<first;i++) grid.innerHTML+=`<div class="cal-day off"></div>`;
  const total=new Date(y,m+1,0).getDate();
  const t0=today0();
  for(let d=1;d<=total;d++){
    const dd=new Date(y,m,d);
    const jj=jobsOn(dd);
    let cls='cal-day';
    const past=isPast(dd),work=isWork(dd);
    if(!work||past) cls+=past?' past':' off';
    else cls+=' workday';
    if(dd.getTime()===t0.getTime()) cls+=' today';
    if(selDate&&dk(dd)===dk(selDate)) cls+=' selected';
    if(jj.length>0) cls+=' has-jobs';
    const dot=jj.length>0?`<div class="job-dot"></div>`:'';
    grid.innerHTML+=`<div class="${cls}" onclick="selBookDay(new Date(${y},${m},${d}))">${d}${dot}</div>`;
  }
}

function selBookDay(d){
  if(!isWork(d)||isPast(d)) return;
  selDate=d; selSlot=null;
  renderBookCal(); renderSlots(); updateBtn();
}

function renderSlots(){
  const wrap=document.getElementById('slot-wrap');
  if(!selDate){wrap.style.display='none';return;}
  wrap.style.display='';
  document.getElementById('slots-label').textContent=selDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'America/Chicago'});
  const daySlots=SLOTS[selDate.getDay()]||[];
  document.getElementById('slot-grid').innerHTML=daySlots.map(s=>{
    const taken=slotTaken(selDate,s);
    const sel=selSlot===s;
    return `<div class="slot-btn${taken?' taken':sel?' selected':''}" onclick="${taken?'':'pickSlot(\''+s+'\')'}">${s}${taken?' · Booked':''}</div>`;
  }).join('');
}

function pickSlot(s){selSlot=s;renderSlots();updateBtn();}
function updateBtn(){
  const name=document.getElementById('cname').value.trim();
  document.getElementById('book-btn').disabled=!(name&&selDate&&selSlot);
}

function bookJob(){
  const name=document.getElementById('cname').value.trim();
  if(!name||!selDate||!selSlot) return;
  const job={
    id:Date.now(), name,
    phone:document.getElementById('cphone').value.trim(),
    address:document.getElementById('caddress').value.trim(),
    price:document.getElementById('cprice').value.trim(),
    paymethod:document.getElementById('cpaymethod').value,
    notes:document.getElementById('cnotes').value.trim(),
    date:dk(selDate), slot:selSlot,
    status:'unconfirmed',
    paid:false
  };
  jobs.push(job);
  jobs.sort((a,b)=>a.date===b.date?a.slot.localeCompare(b.slot):a.date.localeCompare(b.date));
  save();
  ['cname','cphone','caddress','cprice','cnotes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('cpaymethod').value='';
  selDate=null; selSlot=null;
  renderBookCal(); renderSlots(); updateBtn();
  toast(`Booked — ${job.name} on ${fmtDate(job.date)}`);
}

// ── Upcoming ──
function renderUpcoming(){
  const list=document.getElementById('upcoming-list');
  const t0=dk(today0());
  let fut=jobs.filter(j=>j.date>=t0);
  if(upcomingFilter!=='all') fut=fut.filter(j=>j.status===upcomingFilter);
  fut.sort((a,b)=>a.date===b.date?a.slot.localeCompare(b.slot):a.date.localeCompare(b.date));
  if(!fut.length){
    list.innerHTML=`<div class="empty-state"><div class="big">📋</div>No jobs${upcomingFilter!=='all'?' with this status':' yet'}</div>`;
    return;
  }
  let html='',lastDate='';
  for(const j of fut){
    if(j.date!==lastDate){
      html+=`<div class="upcoming-date">${new Date(j.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'America/Chicago'})}</div>`;
      lastDate=j.date;
    }
    html+=jobCardHtml(j);
  }
  list.innerHTML=html;
}

// ── View calendar ──
function renderViewCal(){
  const y=viewMonth.getFullYear(),m=viewMonth.getMonth();
  document.getElementById('view-month-label').textContent=MONTH_NAMES[m]+' '+y;
  const grid=document.getElementById('view-cal');
  grid.innerHTML=DAY_NAMES.map(d=>`<div class="cal-hdr">${d}</div>`).join('');
  const first=new Date(y,m,1).getDay();
  for(let i=0;i<first;i++) grid.innerHTML+=`<div class="cal-day off"></div>`;
  const total=new Date(y,m+1,0).getDate();
  const t0=today0();
  let firstWithJobs=null;
  for(let d=1;d<=total;d++){
    const dd=new Date(y,m,d);
    const jj=jobsOn(dd);
    let cls='cal-day';
    if(!isWork(dd)) cls+=' off';
    else if(isPast(dd)) cls+=' past workday';
    else cls+=' workday';
    if(dd.getTime()===t0.getTime()) cls+=' today';
    if(jj.length>0){cls+=' has-jobs';if(!firstWithJobs)firstWithJobs=dd;}
    const dot=jj.length>0?`<div class="job-dot"></div>`:'';
    grid.innerHTML+=`<div class="${cls}" onclick="showDay(new Date(${y},${m},${d}))">${d}${dot}</div>`;
  }
  if(firstWithJobs) showDay(firstWithJobs);
  else document.getElementById('day-jobs').innerHTML=`<div style="color:var(--text3);font-size:14px;padding:1rem 0;">Tap a date to see jobs</div>`;
}

function showDay(d){
  const jj=jobsOn(d);
  const label=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'America/Chicago'});
  if(!jj.length){
    document.getElementById('day-jobs').innerHTML=`<div class="section-title" style="margin-top:1rem;">${label}</div><div style="color:var(--text3);font-size:14px;padding:0.5rem 0;">No jobs</div>`;
    return;
  }
  document.getElementById('day-jobs').innerHTML=`<div class="section-title" style="margin-top:1rem;">${label}</div>`+jj.map(j=>jobCardHtml(j)).join('');
}

// ── Job card ──
function jobCardHtml(j){
  const si=STATUS_ORDER.indexOf(j.status);
  const steps=STATUS_ORDER.map((s,i)=>{
    const done=i<si, active=i===si;
    const dotCls=active?'step-dot active':done?'step-dot done':'step-dot';
    const lblCls=active?'step-label active':done?'step-label done':'step-label';
    const lbl=s==='unconfirmed'?'Not<br>Confirmed':s==='inprogress'?'In<br>Progress':STATUS_LABELS[s];
    return `<div class="step"><div class="${dotCls}" onclick="advanceStatus(${j.id},'${s}')">${done?'✓':i+1}</div><div class="${lblCls}">${lbl}</div></div>`;
  });
  const lines=STATUS_ORDER.slice(0,-1).map((_,i)=>{
    const done=i<si;
    return `<div class="step-line${done?' done':''}"></div>`;
  });
  // interleave steps and lines
  let stepperHtml='';
  steps.forEach((s,i)=>{stepperHtml+=s;if(i<lines.length)stepperHtml+=lines[i];});

  const confMsg=`Hi ${j.name}! This is a confirmation for your garage cleaning on ${fmtDate(j.date)} at ${j.slot}${j.address?', '+j.address:''}. Reply YES to confirm or call us to reschedule. Thanks!`;

  return `<div class="job-card status-${j.status}" id="jc-${j.id}">
    <div class="job-card-header">
      <div>
        <div class="job-card-name">${j.name}</div>
        <div style="margin-top:5px;"><span class="status-badge ${STATUS_BADGE[j.status]}">${STATUS_LABELS[j.status]}</span></div>
      </div>
      <div class="job-card-slot">${j.slot}</div>
    </div>

    ${j.phone?`<div class="job-detail"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.01 1.21 2 2 0 012 .02h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 14.92z"/></svg>${j.phone}</div>`:''}
    ${j.address?`<div class="job-detail"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>${j.address}</div>`:''}
    ${j.notes?`<div class="job-notes">${j.notes}</div>`:''}

    <div class="stepper" style="margin:14px 0 4px;">${stepperHtml}</div>

    <div class="payment-row">
      <div class="payment-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        ${j.price?`<strong style="color:var(--text);">$${j.price}</strong>`:'No price set'}
        ${j.paymethod?`<span class="payment-method">${j.paymethod}</span>`:''}
      </div>
      <button class="payment-received ${j.paid?'yes':'no'}" onclick="togglePaid(${j.id})">${j.paid?'✓ Paid':'Unpaid'}</button>
    </div>

    <div class="confirm-box">
      <div class="confirm-box-label">📋 Confirmation message</div>
      <div class="confirm-msg">${confMsg}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-sm" onclick="copyConfirm(${j.id})">Copy message</button>
        ${j.phone?`<a href="sms:${j.phone}?body=${encodeURIComponent(confMsg)}" style="text-decoration:none;"><button class="btn-sm">Open in Messages</button></a>`:''}
      </div>
    </div>

    <div class="action-row">
      <button class="btn-sm" onclick="advanceStatus(${j.id},null)">
        ${j.status==='complete'?'↩ Reopen':'Next step →'}
      </button>
      <button class="btn-danger" onclick="deleteJob(${j.id})">Delete</button>
    </div>
  </div>`;
}

function advanceStatus(id, forceTo){
  const j=jobs.find(x=>x.id===id);
  if(!j) return;
  if(forceTo){
    j.status=forceTo;
  } else {
    const i=STATUS_ORDER.indexOf(j.status);
    j.status=i>=STATUS_ORDER.length-1?'unconfirmed':STATUS_ORDER[i+1];
  }
  save();
  refreshCards();
  toast(`${j.name} → ${STATUS_LABELS[j.status]}`);
}

function togglePaid(id){
  const j=jobs.find(x=>x.id===id);
  if(!j) return;
  j.paid=!j.paid;
  save();
  refreshCards();
  toast(j.paid?'Payment received ✓':'Marked unpaid');
}

function copyConfirm(id){
  const j=jobs.find(x=>x.id===id);
  if(!j) return;
  const msg=`Hi ${j.name}! This is a confirmation for your garage cleaning on ${fmtDate(j.date)} at ${j.slot}${j.address?', '+j.address:''}. Reply YES to confirm or call us to reschedule. Thanks!`;
  navigator.clipboard.writeText(msg).then(()=>toast('Message copied!')).catch(()=>toast('Copy failed','error'));
}

function deleteJob(id){
  if(!confirm('Delete this job?')) return;
  jobs=jobs.filter(j=>j.id!==id);
  save();
  refreshCards();
  toast('Job deleted','error');
}

function refreshCards(){
  const activeTab=document.querySelector('.tab.active').textContent.trim().toLowerCase();
  if(activeTab==='upcoming') renderUpcoming();
  else if(activeTab==='calendar') renderViewCal();
}

function prevBookMonth(){bookMonth.setMonth(bookMonth.getMonth()-1);renderBookCal();}
function nextBookMonth(){bookMonth.setMonth(bookMonth.getMonth()+1);renderBookCal();}
function prevViewMonth(){viewMonth.setMonth(viewMonth.getMonth()-1);renderViewCal();}
function nextViewMonth(){viewMonth.setMonth(viewMonth.getMonth()+1);renderViewCal();}

let toastTimer;
function toast(msg,type='success'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast'+(type==='error'?' error':'');
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{el.classList.add('show');});});
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),3000);
}

renderBookCal();
</script>
</body>
</html>
